<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Crave">
<title>Crave</title>
<desc>Reconstruction of the Crave plaque, redrawn 2026-09-28 from the official 320px logo. The outline is a least-squares Bezier fit of ONE traced quadrant, mirrored twice — worst segment RMS 0.39px at the source's own 320. The lettering is deliberately not here: the mark is the plaque, and CRAVE is set as type beside it. Verify against official artwork before launch.</desc>
